segmentation:
  min_area_pct: 0.015      # starting point; tune down if missing small ingredients
  max_aspect_ratio: 4.0
  nms_iou_threshold: 0.4
  max_crops: 20
  max_long_edge: 1536      # API-015: downscale before FastSAM to bound retina-mask memory
  max_det: 100              # API-015: cap masks per scan; still far above the 20-crop cap

component_detection:
  kmeans_k: 4                    # color palette size for complexity heuristic — tune against real photos
  kmeans_min_clusters: 3         # >= this many large clusters = mixed bowl candidate
  large_crop_threshold: 0.25     # mask_pixels / image_pixels threshold for size signal
  role_confidence_threshold: 0.5 # CLIP score below this = UNCERTAIN for any role
  role_prompts:
    base:
      # universal prompts (commented out for diagnostic run)
      # - cooked white rice
      # - cooked grain or brown rice
      # - noodles or pasta
      # - porridge or congee
      - white rice
      - brown rice
      - purple rice
      - noodles
      - congee
      - no grain base visible    # sentinel: role excluded from output if top-1
    protein:
    - beef
    - pork
    - chicken
    - tofu
    - no protein visible
    vegetable:
      - bok choy
      - green vegetables
      - no vegetables visible

usda:
  api_key: PLACEHOLDER   # replace with your key from https://fdc.nal.usda.gov/api-guide.html
                         # or set USDA_API_KEY env var — this file value is the last fallback

portion_defaults:
  bucket_thresholds:
    small_max: 0.15    # ratio < this → small
    medium_max: 0.35   # ratio < this → medium, else large
  bowl_total:          # total gram base for mixed-bowl crops
    small: 300
    medium: 500
    large: 700
  role_weights:        # used to split bowl_total across components
    base: 2.0          # grain/carb dominates bowl volume
    protein: 1.0
    vegetable: 1.0
    default: 1.0
  grain:               # per-100g reference: rice, noodles, congee
    small: 100
    medium: 180
    large: 280
  protein:             # beef, pork, chicken, tofu, fish, egg
    small: 80
    medium: 150
    large: 220
  vegetable:           # bok choy, spinach, broccoli
    small: 60
    medium: 120
    large: 180
  default:             # sauces, unknowns, misc
    small: 90
    medium: 160
    large: 240

glucose_classification:
  spike_threshold_mgdl: 40    # predicted peak delta above pre-meal BG → spike
  drop_threshold_mgdl: 20     # predicted peak delta below pre-meal BG → drop

glucose_training:
  # FOOD-019 D6: exclude a meal from GPR training if its carb_coverage (share
  # of total_carbs_g backed by USDA, not LLM estimation) falls below this.
  # A missing carb_coverage key (pre-FOOD-019 row) is UNKNOWN, not failing,
  # and stays trainable — see pipeline/glucose_model.py:is_trainable().
  # Chosen at n=21 training rows, where one row is ~5% of the corpus; not
  # measurable against fit quality yet. Safe to re-tune — both coverage
  # fields are persisted on the row, so a change here re-admits/excludes
  # rows retroactively with no backfill needed.
  min_carb_coverage: 0.70

llm:
  # FOOD-019: dish decomposition for composite meal names (e.g. "chicken
  # katsu with white rice"). Config-driven per plans/FOOD-019-plan.md D8 so
  # quality can be escalated without a code change — see also D9: swapping
  # this value self-invalidates the decomposition cache (schema_version/model
  # stamp), so a change here does NOT require a manual cache clear.
  decompose_model: claude-sonnet-5

thresholds:
  confident: 0.82        # score >= this -> CONFIDENT
  uncertain: 0.65        # score >= this AND < confident -> UNCERTAIN
                         # score < uncertain -> UNKNOWN
  review_queue_path: data/review_queue.jsonl